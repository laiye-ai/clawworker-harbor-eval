# Local dataset profile: AP 1.5.36 and DeepSeek Flash. Keys stay in runtime env.
# For matching-only turns, the AP Worker must already be initialized in the
# test image/state. A fresh Worker otherwise follows its onboarding rules.
template: /mnt/e/Desktop/模板/ap-specialist-demo-1.5.36.zip
agent:
  name: clawworker-preview
  model_name: openai/deepseek-flash
  base_url: https://api.deepseek.com/v1
  model_api_key_name: MODEL_API_KEY
  model_api_format: openai_chat_completions

