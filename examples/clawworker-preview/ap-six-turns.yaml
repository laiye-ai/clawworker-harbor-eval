# Six-batch AP profile. Paths are relative to this file; keys stay in runtime env.
# For matching-only turns, the AP Worker must already be initialized in the
# test image/state. A fresh Worker otherwise follows its onboarding rules.
template: ./selected-template.zip
agent:
  name: clawworker-preview
  model_name: openai/deepseek-flash
  base_url: https://api.deepseek.com/v1
  model_api_key_name: MODEL_API_KEY
  model_api_format: openai_chat_completions

# One conversation, six user turns, three PDFs per turn.
# Source case names and expected answers are NOT included in user messages.
cases:
  - name: ap-six-document-batches
    turns:
      # Turn 1: source case01.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case01/po.pdf
          - ./inputs/case01/delivery.pdf
          - ./inputs/case01/invoice.pdf
      # Turn 2: source case04.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case04/po.pdf
          - ./inputs/case04/delivery.pdf
          - ./inputs/case04/invoice.pdf
      # Turn 3: source case07.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case07/po.pdf
          - ./inputs/case07/delivery.pdf
          - ./inputs/case07/invoice.pdf
      # Turn 4: source case06, an independent normal batch after case07.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case06/po.pdf
          - ./inputs/case06/delivery.pdf
          - ./inputs/case06/invoice.pdf
      # Turn 5: source case12.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case12/po.pdf
          - ./inputs/case12/delivery.pdf
          - ./inputs/case12/invoice.pdf
      # Turn 6: source case20.
      - question: 请匹配这三份单据。
        attachments:
          - ./inputs/case20/po.pdf
          - ./inputs/case20/delivery.pdf
          - ./inputs/case20/invoice.pdf

n_attempts: 1
timeout_sec: 600
