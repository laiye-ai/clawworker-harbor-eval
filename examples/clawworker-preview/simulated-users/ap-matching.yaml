          d06: ./inputs/weekly/供货单/DO_d06_0790417.pdf
          d07: ./inputs/weekly/供货单/DO_d07_0199432.pdf
        verifier: ./checks/verify-ap.sh
        verifier_env:
          AP_INVOICE: "HPF-289823"
          AP_STATUS: MATCHED_PREVIEW_READY
